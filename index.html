<!-- الكود الكامل المحدث الذي أرسلته للتو -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم بوت الباسم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBOUvJ9gAmLMZ9N2Ux044Vq4PZ5q0HGw88",
            authDomain: "albasem-bot-control.firebaseapp.com",
            databaseURL: "https://albasem-bot-control-default-rtdb.firebaseio.com",
            projectId: "albasem-bot-control",
            storageBucket: "albasem-bot-control.firebasestorage.app",
            messagingSenderId: "283984476655",
            appId: "1:283984476655:web:b6546a3ed34505ca415e1a"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const authScreen = document.getElementById("auth-screen");
        const panelScreen = document.getElementById("panel-screen");
        const loginBtn = document.getElementById("login-btn");
        const logoutBtn = document.getElementById("logout-btn");

        const dotGreen = document.getElementById("dot-green");
        const dotYellow = document.getElementById("dot-yellow");
        const dotRed = document.getElementById("dot-red");

        const statusText = document.getElementById("status-text");
        const logBox = document.getElementById("log-box");
        const lastSyncBadge = document.getElementById("last-sync");
        const btnStart = document.getElementById("btn-start");
        const btnStop = document.getElementById("btn-stop");
        const btnNtfy = document.getElementById("btn-ntfy");

        let lastData = {};

        loginBtn.addEventListener("click", async () => {
            const email = document.getElementById("login-email").value;
            const pass = document.getElementById("login-pass").value;
            const errDiv = document.getElementById("auth-error");
            try {
                errDiv.classList.add("hidden");
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (err) {
                errDiv.innerText = "خطأ في تسجيل الدخول: " + err.message;
                errDiv.classList.remove("hidden");
            }
        });

        logoutBtn.addEventListener("click", () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                authScreen.classList.add("hidden");
                panelScreen.classList.remove("hidden");
                initRealtime();
            } else {
                panelScreen.classList.add("hidden");
                authScreen.classList.remove("hidden");
            }
        });

        function updateUI() {
            const now = Date.now();
            const lastSeen = lastData.last_seen || 0;
            const diffSeconds = Math.floor((now - lastSeen) / 1000);
            const isOnline = lastSeen > 0 && diffSeconds <= 35;
            const isConfigRunning = lastData.status === "running";

            dotGreen.className = "w-3.5 h-3.5 rounded-full bg-emerald-950/60 border border-emerald-900";
            dotYellow.className = "w-3.5 h-3.5 rounded-full bg-amber-950/60 border border-amber-900";
            dotRed.className = "w-3.5 h-3.5 rounded-full bg-rose-950/60 border border-rose-900";

            if (isConfigRunning && isOnline) {
                dotGreen.className = "w-3.5 h-3.5 rounded-full bg-emerald-400 shadow-[0_0_12px_#34d399] animate-pulse";
                statusText.innerHTML = `<span class="text-emerald-400 font-bold text-sm">🟢 يعمل بنشاط (PID: ${lastData.pid || 'نشط'})</span>`;
                logBox.innerText = `[${lastData.heartbeat || '--:--:--'}] ${lastData.last_log || 'البوت قيد الاستماع والتفاعل...'}`;
                btnStart.disabled = true;
                btnStop.disabled = false;
            } else if (isConfigRunning && !isOnline) {
                dotYellow.className = "w-3.5 h-3.5 rounded-full bg-amber-400 shadow-[0_0_12px_#fbbf24] animate-pulse";
                statusText.innerHTML = `<span class="text-amber-400 font-bold text-sm">🟡 قيد الانتظار (انقطاع كهرباء أو إنترنت)</span>`;
                logBox.innerText = `⚠️ انقطع الاتصال بالجهاز منذ ${diffSeconds} ثانية. اللوحة بانتظار عودة النظام تلقائياً...`;
                btnStart.disabled = true;
                btnStop.disabled = true;
            } else {
                dotRed.className = "w-3.5 h-3.5 rounded-full bg-rose-500 shadow-[0_0_12px_#f43f5e]";
                statusText.innerHTML = `<span class="text-rose-400 font-bold text-sm">🔴 متوقف تماماً (يدوياً)</span>`;
                logBox.innerText = `[${lastData.last_action || '--:--:--'}] البوت متوقف حالياً. انقر على تشغيل للبدء.`;
                btnStart.disabled = false;
                btnStop.disabled = true;
            }

            lastSyncBadge.innerText = lastData.heartbeat || lastData.last_sync || "--:--:--";

            const isNtfy = lastData.ntfy_enabled !== false;
            if (btnNtfy) {
                if (isNtfy) {
                    btnNtfy.innerHTML = "🔔 إشعارات الجوال: مفعّلة";
                    btnNtfy.className = "w-full bg-slate-800 hover:bg-slate-700 border border-emerald-500/40 text-emerald-400 font-bold py-2.5 rounded-xl transition shadow text-xs sm:text-sm";
                } else {
                    btnNtfy.innerHTML = "🔕 إشعارات الجوال: معطّلة";
                    btnNtfy.className = "w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-400 font-bold py-2.5 rounded-xl transition shadow text-xs sm:text-sm";
                }
            }
        }

        function initRealtime() {
            const controlRef = ref(db, 'bot_control');
            onValue(controlRef, (snapshot) => {
                lastData = snapshot.val() || {};
                updateUI();
            });
            setInterval(updateUI, 5000);
        }

        document.addEventListener("DOMContentLoaded", () => {
            const btnStartElem = document.getElementById("btn-start");
            const btnStopElem = document.getElementById("btn-stop");
            const btnNtfyElem = document.getElementById("btn-ntfy");

            if (btnStartElem) {
                btnStartElem.addEventListener("click", () => {
                    update(ref(db, 'bot_control'), { target_state: "START" });
                });
            }

            if (btnStopElem) {
                btnStopElem.addEventListener("click", () => {
                    update(ref(db, 'bot_control'), { target_state: "STOP" });
                });
            }

            if (btnNtfyElem) {
                btnNtfyElem.addEventListener("click", () => {
                    const currentStatus = lastData.ntfy_enabled !== false;
                    update(ref(db, 'bot_control'), { ntfy_enabled: !currentStatus });
                });
            }
        });
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-sky-500 selection:text-white">

    <div id="auth-screen" class="w-full max-w-sm bg-slate-900 p-6 rounded-2xl shadow-2xl border border-slate-800">
        <h2 class="text-xl font-bold text-center mb-6 text-sky-400">📡 لوحة تحكم الباسم</h2>
        <div id="auth-error" class="hidden mb-4 p-3 bg-red-950/80 border border-red-500/50 rounded text-red-200 text-xs text-center"></div>
        <div class="space-y-4">
            <div>
                <label class="block text-xs text-slate-400 mb-1">البريد الإلكتروني</label>
                <input id="login-email" type="email" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-sky-500 text-slate-200">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">كلمة المرور</label>
                <input id="login-pass" type="password" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-sm focus:outline-none focus:border-sky-500 text-slate-200">
            </div>
            <button id="login-btn" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-2.5 rounded-lg transition">تسجيل الدخول</button>
        </div>
    </div>

    <div id="panel-screen" class="hidden w-full max-w-md bg-slate-900 p-6 rounded-2xl shadow-2xl border border-slate-800">
        <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
            <div class="flex items-center space-x-2 space-x-reverse">
                <span class="text-base font-bold text-slate-100">بوت واتساب الباسم</span>
            </div>
            <div class="flex items-center gap-2 bg-slate-950/80 px-3 py-1.5 rounded-full border border-slate-800">
                <div id="dot-green" title="يعمل بنشاط" class="w-3.5 h-3.5 rounded-full bg-emerald-950/60 border border-emerald-900"></div>
                <div id="dot-yellow" title="قيد الانتظار (طوارئ)" class="w-3.5 h-3.5 rounded-full bg-amber-950/60 border border-amber-900"></div>
                <div id="dot-red" title="متوقف يدوياً" class="w-3.5 h-3.5 rounded-full bg-rose-950/60 border border-rose-900"></div>
            </div>
            <button id="logout-btn" class="text-xs text-slate-400 hover:text-rose-400 transition">خروج</button>
        </div>

        <div class="bg-slate-950/90 p-4 rounded-xl mb-4 border border-slate-800/80 text-center space-y-2">
            <div id="status-text">
                <span class="text-slate-400 text-sm">جاري التحقق من النبض...</span>
            </div>
            <div class="text-[11px] text-slate-500">آخر توقيت نبض مسجل: <span id="last-sync" class="text-sky-400 font-mono">--:--:--</span></div>
        </div>

        <div class="mb-6">
            <div class="flex items-center justify-between text-[11px] text-slate-400 mb-1 px-1">
                <span>سجل النشاط المباشر (Console)</span>
                <span class="flex h-2 w-2 relative">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-sky-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-sky-500"></span>
                </span>
            </div>
            <div class="bg-black/90 rounded-xl p-3 border border-slate-800 font-mono text-xs text-emerald-400 min-h-[52px] flex items-center leading-relaxed break-all select-all shadow-inner" id="log-box">
                جاري الاتصال بالسيرفر...
            </div>
        </div>

        <div class="mt-3">
            <button id="btn-ntfy" class="w-full bg-slate-800 hover:bg-slate-700 border border-emerald-500/40 text-emerald-400 font-bold py-2.5 rounded-xl transition shadow text-xs sm:text-sm">
                🔔 إشعارات الجوال: مفعّلة
            </button>
        </div>

        <div class="grid grid-cols-2 gap-4 mt-4">
            <button id="btn-start" class="w-full bg-emerald-600 hover:bg-emerald-500 disabled:opacity-30 disabled:cursor-not-allowed text-white font-bold py-3 rounded-xl transition shadow-lg shadow-emerald-950/40">
                ▶ تشغيل
            </button>
            <button id="btn-stop" class="w-full bg-rose-600 hover:bg-rose-500 disabled:opacity-30 disabled:cursor-not-allowed text-white font-bold py-3 rounded-xl transition shadow-lg shadow-rose-950/40">
                ⏹ إيقاف فوراً
            </button>
        </div>
    </div>
</body>
</html>
